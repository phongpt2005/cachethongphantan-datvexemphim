# ============================================================================
# HỆ THỐNG ĐẶT VÉ XEM PHIM PHÂN TÁN — BẢN CHẠY NHANH TRÊN 1 MÁY (phát triển/kiểm thử)
# ----------------------------------------------------------------------------
# Bản triển khai thật trên 2 máy (Primary/Standby + repmgr + witness) nằm ở deploy/.
# ============================================================================

x-app-limits: &app-limits
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 256M

services:
  # ============================================================================
  # INFRASTRUCTURE DATABASES, CACHE & MESSAGE BROKER
  # ============================================================================
  postgres-inventory:
    image: postgres:15-alpine
    container_name: postgres-inventory
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - "5432"
    volumes:
      - inventory_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  postgres-booking:
    image: postgres:15-alpine
    container_name: postgres-booking
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - "5432"
    volumes:
      - booking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    # Expose internally, and map to alternate ports to avoid conflict with host RabbitMQ
    ports:
      - "5674:5672"     # AMQP alternate port on host
      - "15674:15672"   # Management Web UI on http://localhost:15674 (guest/guest)
    expose:
      - "5672"
      - "15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ============================================================================
  # MICROSERVICES
  # ============================================================================
  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    image: movie-booking/inventory-service:latest
    container_name: inventory-service
    <<: *app-limits
    restart: unless-stopped
    environment:
      DB_HOST: postgres-inventory
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: inventory_db
      REDIS_MASTER_HOST: redis
      REDIS_LOCAL_HOST: redis
      LOCK_STRATEGY: ${LOCK_STRATEGY:-pessimistic}
      PROTO_PATH: /app/shared/protos/inventory.proto
    volumes:
      - ./shared/protos:/app/shared/protos:ro
    ports:
      - "50052:50052"
      - "3002:3002"
    depends_on:
      postgres-inventory:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    image: movie-booking/booking-service:latest
    # Note: No container_name here to allow docker compose up --scale booking-service=3
    <<: *app-limits
    restart: unless-stopped
    environment:
      DB_HOST: postgres-booking
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: booking_db
      INVENTORY_GRPC_URL: inventory-service:50052
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      INVENTORY_PROTO_PATH: /app/shared/protos/inventory.proto
      BOOKING_PROTO_PATH: /app/shared/protos/booking.proto
    volumes:
      - ./shared/protos:/app/shared/protos:ro
    expose:
      - "50051"
      - "3001"
    depends_on:
      postgres-booking:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  booking-lb:
    image: nginx:alpine
    container_name: booking-lb
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "50051:50051"
      - "8088:80"       # Health check on http://localhost:8088/health (avoids 8080)
    depends_on:
      - booking-service

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    image: movie-booking/notification-service:latest
    container_name: notification-service
    <<: *app-limits
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: movie-booking/api-gateway:latest
    container_name: api-gateway
    <<: *app-limits
    restart: unless-stopped
    environment:
      PORT: 3000
      UV_THREADPOOL_SIZE: 4
      # Circuit Breaker: 5 lỗi hạ tầng liên tiếp -> OPEN, sau 15 s -> HALF_OPEN thăm dò
      CIRCUIT_FAILURE_THRESHOLD: 5
      CIRCUIT_RESET_MS: 15000
      RABBITMQ_MGMT_URL: http://guest:guest@rabbitmq:15672
      INVENTORY_GRPC_URL: inventory-service:50052
      BOOKING_GRPC_URL: booking-lb:50051
      INVENTORY_HTTP_URL: http://inventory-service:3002
      BOOKING_HTTP_HOST: booking-service
      BOOKING_HTTP_PORT: 3001
      INVENTORY_PROTO_PATH: /app/shared/protos/inventory.proto
      BOOKING_PROTO_PATH: /app/shared/protos/booking.proto
    volumes:
      - ./shared/protos:/app/shared/protos:ro
    ports:
      - "3000:3000"
    depends_on:
      booking-lb:
        condition: service_started
      inventory-service:
        condition: service_healthy

volumes:
  inventory_pgdata:
  booking_pgdata:
