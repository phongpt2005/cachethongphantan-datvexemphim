# Cụm RabbitMQ 3 nút (máy 1, máy 2, Node 3) — tự ghép cụm khi khởi động
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit-node1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit-node2
cluster_formation.classic_config.nodes.3 = rabbit@rabbit-node3

# Phân vùng mạng: phía thiểu số (1/3) tự tạm dừng thay vì chạy riêng -> không có 2 hàng đợi lệch nhau
cluster_partition_handling = pause_minority

# Quorum queue (Raft) luôn giữ đủ 3 bản sao: nút nào gia nhập sau sẽ được thêm vào nhóm Raft
quorum_queue.continuous_membership_reconciliation.enabled = true
quorum_queue.continuous_membership_reconciliation.target_group_size = 3
quorum_queue.continuous_membership_reconciliation.trigger_interval = 10000
quorum_queue.continuous_membership_reconciliation.interval = 30000
