# ==============================================================================
# MÁY VẬT LÝ 2 — SECONDARY NODE: Standby của 2 cụm CSDL + Redis Replica + RabbitMQ #2
#   Khởi động:  node deploy/cluster.mjs up 2      (sau khi máy 1 đã chạy)
#
#   Cổng mở ra mạng LAN:
#     3100  API Gateway máy 2
#     5511  PostgreSQL inventory     5512  PostgreSQL booking
#     8018  pg-router /status        15684 RabbitMQ UI
#   (Cổng khác máy 1 để có thể tập dượt cả 2 "máy" trên cùng một laptop.)
# ==============================================================================
name: node2

x-pg-node: &pg-node
  build: ../../db-cluster
  image: movie-booking/pg-repmgr:15
  restart: unless-stopped
  cap_add: [NET_ADMIN]   # cho phép chèn luật iptables khi demo "đứt mạng"
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
    interval: 3s
    timeout: 3s
    retries: 100   # có thể phải chờ máy 1 khởi động xong

x-app: &app
  restart: unless-stopped
  deploy:
    resources:
      limits: { cpus: "1.0", memory: 256M }

services:
  # ---------------------------------------------------------------- CSDL (repmgr)
  pg-inv-node2:
    <<: *pg-node
    container_name: pg-inv-node2
    environment:
      POSTGRES_PASSWORD: postgres
      NODE_ID: 2
      NODE_NAME: inv-node2
      PRIORITY: 90
      INITIAL_ROLE: standby
      ADVERTISE_HOST: ${NODE2_IP}
      ADVERTISE_PORT: 5511
      PEERS: ${NODE1_IP}:5501
    ports: ["5511:5432"]
    volumes: [pg_inv:/var/lib/postgresql/data]

  pg-book-node2:
    <<: *pg-node
    container_name: pg-book-node2
    environment:
      POSTGRES_PASSWORD: postgres
      NODE_ID: 2
      NODE_NAME: book-node2
      PRIORITY: 90
      INITIAL_ROLE: standby
      ADVERTISE_HOST: ${NODE2_IP}
      ADVERTISE_PORT: 5512
      PEERS: ${NODE1_IP}:5502
    ports: ["5512:5432"]
    volumes: [pg_book:/var/lib/postgresql/data]

  pg-router:
    build: ../pg-router
    image: movie-booking/pg-router:latest
    container_name: pg-router-node2
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    environment:
      NODE_ID: node2
      PGPASSWORD: postgres
      ROUTES: 5432=${NODE1_IP}:5501,${NODE2_IP}:5511|${NODE3_IP}:5503;5433=${NODE1_IP}:5502,${NODE2_IP}:5512|${NODE3_IP}:5504
    ports: ["8018:8008"]

  # ---------------------------------------------------------------- Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: redis-node2
    restart: unless-stopped
    # Bản sao chỉ đọc của Redis Master máy 1: lệnh DEL cache được stream sang trong vài ms
    command: redis-server --protected-mode no --replicaof ${NODE1_IP} 6379 --replica-read-only yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-node2
    hostname: rabbit-node2
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: movie_booking_cluster_cookie_2026
    volumes: [../rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro]
    ports: ["15684:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------- Microservices
  inventory-service:
    <<: *app
    build: ../../inventory-service
    image: movie-booking/inventory-service:latest
    container_name: inventory-node2
    environment:
      NODE_ID: node2
      DB_MASTER_HOST: pg-router      # GHI -> Primary hiện tại (bình thường ở máy 1)
      DB_MASTER_PORT: 5432
      DB_REPLICA_HOST: pg-inv-node2  # ĐỌC -> Standby ngay trên máy này
      DB_REPLICA_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: inventory_db
      REDIS_MASTER_HOST: ${NODE1_IP}
      REDIS_MASTER_PORT: 6379
      REDIS_LOCAL_HOST: redis
      REDIS_LOCAL_PORT: 6379
      LOCK_STRATEGY: ${LOCK_STRATEGY:-pessimistic}
      PROTO_PATH: /app/shared/protos/inventory.proto
    volumes: [../../shared/protos:/app/shared/protos:ro]
    depends_on:
      pg-inv-node2: { condition: service_healthy }
      pg-router: { condition: service_started }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  booking-service:
    <<: *app
    build: ../../booking-service
    image: movie-booking/booking-service:latest
    environment:
      NODE_ID: node2
      DB_HOST: pg-router
      DB_PORT: 5433
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: booking_db
      INVENTORY_GRPC_URL: inventory-service:50052
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      INVENTORY_PROTO_PATH: /app/shared/protos/inventory.proto
      BOOKING_PROTO_PATH: /app/shared/protos/booking.proto
    volumes: [../../shared/protos:/app/shared/protos:ro]
    depends_on:
      pg-book-node2: { condition: service_healthy }
      inventory-service: { condition: service_started }   # chờ quorum: tự thử lại tới khi cụm đủ 2/3 nút
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  booking-lb:
    image: nginx:alpine
    container_name: booking-lb-node2
    restart: unless-stopped
    volumes: [../nginx-booking.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [booking-service]

  notification-service:
    <<: *app
    build: ../../notification-service
    image: movie-booking/notification-service:latest
    container_name: notification-node2
    environment:
      NODE_ID: node2
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq: { condition: service_healthy }

  api-gateway:
    <<: *app
    build: ../../api-gateway
    image: movie-booking/api-gateway:latest
    container_name: gateway-node2
    environment:
      NODE_ID: node2
      PORT: 3000
      INVENTORY_GRPC_URL: inventory-service:50052
      BOOKING_GRPC_URL: booking-lb:50051
      INVENTORY_HTTP_URL: http://inventory-service:3002
      BOOKING_HTTP_HOST: booking-service
      BOOKING_HTTP_PORT: 3001
      PG_ROUTER_URL: http://pg-router:8008
      RABBITMQ_MGMT_URL: http://guest:guest@rabbitmq:15672
      GRPC_DEADLINE_MS: 1500
      CIRCUIT_FAILURE_THRESHOLD: 5
      CIRCUIT_RESET_MS: 15000
      INVENTORY_PROTO_PATH: /app/shared/protos/inventory.proto
      BOOKING_PROTO_PATH: /app/shared/protos/booking.proto
    volumes: [../../shared/protos:/app/shared/protos:ro]
    ports: ["3100:3000"]
    depends_on:
      booking-lb: { condition: service_started }
      inventory-service: { condition: service_started }   # chờ quorum: tự thử lại tới khi cụm đủ 2/3 nút

volumes:
  pg_inv:
  pg_book:
