# gRPC Load Balancer cho booking-service trên MỘT máy.
# Phân giải động qua DNS của Docker -> tự thấy bản sao mới khi --scale.
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=2s ipv6=off;
    log_format grpc_log '[$time_local] $remote_addr -> $upstream_addr status=$status rt=$request_time';
    access_log /var/log/nginx/access.log grpc_log;

    server {
        listen 50051;
        http2 on;
        location / {
            set $booking_backend "booking-service:50051";
            grpc_pass grpc://$booking_backend;
            grpc_connect_timeout 2s;
            grpc_read_timeout 30s;
        }
    }

    server {
        listen 80;
        location /health {
            return 200 '{"status":"ok","component":"booking-lb"}\n';
            add_header Content-Type application/json;
        }
    }
}
