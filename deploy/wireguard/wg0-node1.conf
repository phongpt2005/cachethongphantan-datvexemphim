[Interface]
# Private key của Node 1 (Tạo qua lệnh: wg genkey)
PrivateKey = <NODE1_PRIVATE_KEY>
Address = 10.0.0.1/24
ListenPort = 51820

# Forwarding và NAT cho mạng VPN
PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

# -------------------------------------------------------------
# PEER: NODE 2 (Secondary Datacenter / DB Replica)
# -------------------------------------------------------------
[Peer]
PublicKey = <NODE2_PUBLIC_KEY>
AllowedIPs = 10.0.0.2/32
Endpoint = <NODE2_PUBLIC_IP>:51820
PersistentKeepalive = 25

# -------------------------------------------------------------
# PEER: NODE 3 (Witness Node / Quorum Arbitrator)
# -------------------------------------------------------------
[Peer]
PublicKey = <NODE3_PUBLIC_KEY>
AllowedIPs = 10.0.0.3/32
Endpoint = <NODE3_PUBLIC_IP>:51820
PersistentKeepalive = 25
