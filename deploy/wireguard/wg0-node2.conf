[Interface]
# Private key của Node 2
PrivateKey = <NODE2_PRIVATE_KEY>
Address = 10.0.0.2/24
ListenPort = 51820

# -------------------------------------------------------------
# PEER: NODE 1 (Primary Datacenter / DB Master)
# -------------------------------------------------------------
[Peer]
PublicKey = <NODE1_PUBLIC_KEY>
AllowedIPs = 10.0.0.1/32
Endpoint = <NODE1_PUBLIC_IP>:51820
PersistentKeepalive = 25

# -------------------------------------------------------------
# PEER: NODE 3 (Witness Node / Quorum Arbitrator)
# -------------------------------------------------------------
[Peer]
PublicKey = <NODE3_PUBLIC_KEY>
AllowedIPs = 10.0.0.3/32
Endpoint = <NODE3_PUBLIC_IP>:51820
PersistentKeepalive = 25
