# ==============================================================================
# MÁY VẬT LÝ 1 — PRIMARY NODE: Primary ban đầu của 2 cụm CSDL + Redis Master + RabbitMQ #1
#   Khởi động:  node deploy/cluster.mjs up 1      (đọc IP 3 máy từ deploy/cluster.env)
#
#   Cổng mở ra mạng LAN:
#     3000  API Gateway máy 1        8008  pg-router /status
#     5501  PostgreSQL inventory     5502  PostgreSQL booking
#     6379  Redis Master             15674 RabbitMQ UI
# ==============================================================================
name: node1

x-pg-node: &pg-node
  build: ../../db-cluster
  image: movie-booking/pg-repmgr:15
  restart: unless-stopped
  cap_add: [NET_ADMIN]   # cho phép chèn luật iptables khi demo "đứt mạng"
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
    interval: 3s
    timeout: 3s
    retries: 30

x-app: &app
  restart: unless-stopped
  deploy:
    resources:
      limits: { cpus: "1.0", memory: 256M }

services:
  # ---------------------------------------------------------------- CSDL (repmgr)
  pg-inv-node1:
    <<: *pg-node
    container_name: pg-inv-node1
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_db
      NODE_ID: 1
      NODE_NAME: inv-node1
      PRIORITY: 100
      INITIAL_ROLE: primary
      ADVERTISE_HOST: ${NODE1_IP}
      ADVERTISE_PORT: 5501
      PEERS: ${NODE2_IP}:5511
    ports: ["5501:5432"]
    volumes: [pg_inv:/var/lib/postgresql/data]

  pg-book-node1:
    <<: *pg-node
    container_name: pg-book-node1
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking_db
      NODE_ID: 1
      NODE_NAME: book-node1
      PRIORITY: 100
      INITIAL_ROLE: primary
      ADVERTISE_HOST: ${NODE1_IP}
      ADVERTISE_PORT: 5502
      PEERS: ${NODE2_IP}:5512
    ports: ["5502:5432"]
    volumes: [pg_book:/var/lib/postgresql/data]

  # Ứng dụng luôn ghi qua đây; router tự tìm Primary hiện tại của mỗi cụm
  pg-router:
    build: ../pg-router
    image: movie-booking/pg-router:latest
    container_name: pg-router-node1
    restart: unless-stopped
    cap_add: [NET_ADMIN]   # chỉ dùng khi tập dượt: mô phỏng rút mạng máy 1
    environment:
      NODE_ID: node1
      PGPASSWORD: postgres
      ROUTES: 5432=${NODE1_IP}:5501,${NODE2_IP}:5511|${NODE3_IP}:5503;5433=${NODE1_IP}:5502,${NODE2_IP}:5512|${NODE3_IP}:5504
    ports: ["8008:8008"]

  # ---------------------------------------------------------------- Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: redis-node1
    restart: unless-stopped
    command: redis-server --protected-mode no --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-node1
    hostname: rabbit-node1
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: movie_booking_cluster_cookie_2026
    volumes: [../rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro]
    ports: ["15674:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------- Microservices
  inventory-service:
    <<: *app
    build: ../../inventory-service
    image: movie-booking/inventory-service:latest
    container_name: inventory-node1
    environment:
      NODE_ID: node1
      DB_MASTER_HOST: pg-router      # GHI -> Primary hiện tại (có thể đang ở máy 2)
      DB_MASTER_PORT: 5432
      DB_REPLICA_HOST: pg-inv-node1  # ĐỌC -> nút CSDL ngay trên máy này
      DB_REPLICA_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: inventory_db
      REDIS_MASTER_HOST: ${NODE1_IP}
      REDIS_MASTER_PORT: 6379
      REDIS_LOCAL_HOST: redis
      REDIS_LOCAL_PORT: 6379
      LOCK_STRATEGY: ${LOCK_STRATEGY:-pessimistic}
      PROTO_PATH: /app/shared/protos/inventory.proto
    volumes: [../../shared/protos:/app/shared/protos:ro]
    depends_on:
      pg-inv-node1: { condition: service_healthy }
      pg-router: { condition: service_started }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  booking-service:
    <<: *app
    build: ../../booking-service
    image: movie-booking/booking-service:latest
    # không đặt container_name để có thể --scale booking-service=N
    environment:
      NODE_ID: node1
      DB_HOST: pg-router
      DB_PORT: 5433
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: booking_db
      INVENTORY_GRPC_URL: inventory-service:50052
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      INVENTORY_PROTO_PATH: /app/shared/protos/inventory.proto
      BOOKING_PROTO_PATH: /app/shared/protos/booking.proto
    volumes: [../../shared/protos:/app/shared/protos:ro]
    depends_on:
      pg-book-node1: { condition: service_healthy }
      inventory-service: { condition: service_started }   # chờ quorum: tự thử lại tới khi cụm đủ 2/3 nút
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  booking-lb:
    image: nginx:alpine
    container_name: booking-lb-node1
    restart: unless-stopped
    volumes: [../nginx-booking.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [booking-service]

  notification-service:
    <<: *app
    build: ../../notification-service
    image: movie-booking/notification-service:latest
    container_name: notification-node1
    environment:
      NODE_ID: node1
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq: { condition: service_healthy }

  api-gateway:
    <<: *app
    build: ../../api-gateway
    image: movie-booking/api-gateway:latest
    container_name: gateway-node1
    environment:
      NODE_ID: node1
      PORT: 3000
      INVENTORY_GRPC_URL: inventory-service:50052
      BOOKING_GRPC_URL: booking-lb:50051
      INVENTORY_HTTP_URL: http://inventory-service:3002
      BOOKING_HTTP_HOST: booking-service
      BOOKING_HTTP_PORT: 3001
      PG_ROUTER_URL: http://pg-router:8008
      RABBITMQ_MGMT_URL: http://guest:guest@rabbitmq:15672
      GRPC_DEADLINE_MS: 1500
      CIRCUIT_FAILURE_THRESHOLD: 5
      CIRCUIT_RESET_MS: 15000
      INVENTORY_PROTO_PATH: /app/shared/protos/inventory.proto
      BOOKING_PROTO_PATH: /app/shared/protos/booking.proto
    volumes: [../../shared/protos:/app/shared/protos:ro]
    ports: ["3000:3000"]
    depends_on:
      booking-lb: { condition: service_started }
      inventory-service: { condition: service_started }   # chờ quorum: tự thử lại tới khi cụm đủ 2/3 nút

volumes:
  pg_inv:
  pg_book:
